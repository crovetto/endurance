<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassTimer – Chronomètre élèves</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#3987fb">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClassTimer">

<style>
/* ===== Thème (clair par défaut, sombre au choix) ===== */
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#3987fb;--on:#22c55e;--onbg:#dcfce7;--ontx:#15803d;--dng:#ef4444}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--tx:#e8edf6;--mut:#8b9ab3;--line:#243049;--onbg:#0f3a25;--ontx:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:clamp(26px,5vw,34px);margin:8px 0 16px;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:20px}
small{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font-weight:700;font-size:18px}
.back{display:inline-block;padding:10px 0;color:var(--pri);font-weight:600;text-decoration:none}

/* ===== Boutons ===== */
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 16px system-ui,sans-serif;cursor:pointer}
.btn:active{transform:scale(.98)}
.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.dng{color:var(--dng)}
.big{width:100%;min-height:60px;font-size:18px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.bar .btn{flex:1 1 200px}

/* ===== Classes ===== */
.grid{display:grid;gap:12px;margin-top:16px}
.cc{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;min-height:80px}
.cc b{font-size:20px;display:block}
.cc .grow{flex:1}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.empty{padding:32px 16px;text-align:center;color:var(--mut)}

/* ===== Élèves ===== */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.head h1{margin:0}
.badge{padding:6px 12px;border-radius:99px;background:var(--line);color:var(--mut);font-weight:600;font-size:14px}
.badge.live{background:var(--on);color:#fff}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stu{position:relative;display:flex;min-height:170px;flex-direction:column;align-items:center;justify-content:center;padding:16px 10px 10px;background:#eef6ff;border:2px solid #b8d8fb;border-radius:16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;text-align:center;overflow:hidden}
.stu .num{position:absolute;top:8px;left:10px;font-size:12px;font-weight:700;color:var(--mut)}
.stu .status-dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:#93c5fd}
.stu .nm{width:100%;margin-top:8px}
.stu .nm b{font-size:clamp(18px,4.8vw,22px);line-height:1.12;display:block;overflow-wrap:anywhere}
.stu .nm small{display:block;margin-top:4px;font-size:12px;color:var(--mut)}
.stu .tm{margin-top:12px;font-size:clamp(24px,7vw,32px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stu .tap-hint{margin-top:8px;font-size:12px;color:var(--mut)}
.stu .tools{width:100%;display:flex;justify-content:center;gap:6px;margin-top:11px;padding-top:9px;border-top:1px solid rgba(100,116,139,.18)}
.stu .tools button{width:36px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--mut);font-size:14px;cursor:pointer}
.stu.on{border-color:#86d39d;background:#effbf2}
.stu.on .status-dot{background:var(--on);box-shadow:0 0 0 5px rgba(34,197,94,.12)}
.stu.on .tm,.stu.on .tap-hint{color:var(--ontx)}
:root[data-theme=dark] .stu{background:#12233b;border-color:#31557f}
:root[data-theme=dark] .stu.on{background:#102d20;border-color:#2f8f51}
:root[data-theme=dark] .stu .tools button{background:rgba(19,28,46,.72)}
@media (min-width:680px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}.stu{min-height:185px}}
@media (max-width:360px){.list{gap:8px}.stu{min-height:160px;padding-left:8px;padding-right:8px}.stu .tm{font-size:23px}}

/* ===== Fenêtres ===== */
dialog{border:0;border-radius:20px;padding:22px;width:min(440px,92vw);background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,23,42,.55)}
dialog label{display:block;margin:0 0 12px;font-weight:600;font-size:14px}
dialog input{display:block;width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:18px system-ui,sans-serif}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.row .btn{min-width:110px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.scroll{max-height:50vh;overflow:auto}

/* ===== Sauvegarde / historique ===== */
.save-state{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;margin:4px 0 10px}
.save-dot{width:9px;height:9px;border-radius:50%;background:var(--on);flex:none}
.hist{margin-top:16px}
.hist-card{padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.hist-card b{display:block}
.hist-card small{display:block;margin-top:3px}


.install-wrap{margin:10px 0 4px}
.install-note{margin-top:7px;font-size:13px;color:var(--mut)}
.offline-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--line);color:var(--mut);font-size:13px;font-weight:600}
.offline-badge.ok{background:var(--onbg);color:var(--ontx)}


/* ===== Grille compacte type Run Lap Tap ===== */
.list{
  display:grid !important;
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:6px !important;
  margin-top:10px !important;
}

.stu{
  position:relative;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:2px !important;
  min-width:0 !important;
  aspect-ratio:1 / 1.05;
  min-height:0 !important;
  padding:8px 4px 7px !important;
  border-radius:12px !important;
  border:1.5px solid #9cc9f8 !important;
  background:#eaf4ff !important;
  text-align:center !important;
  overflow:hidden;
}

.stu.on{
  border-color:#75d48a !important;
  background:#effbf1 !important;
}

.stu .ic{
  display:none !important;
}

.student-number{
  position:absolute;
  top:5px;
  left:6px;
  font-size:9px;
  color:var(--mut);
  font-weight:700;
}

.student-more{
  position:absolute;
  top:1px;
  right:3px;
  width:20px;
  height:20px;
  border:0;
  background:transparent;
  color:var(--mut);
  font-size:15px;
  line-height:18px;
  padding:0;
  cursor:pointer;
  z-index:2;
}

.stu .nm{
  width:100%;
  min-width:0;
  padding-top:5px;
}

.stu .nm b{
  display:block !important;
  font-size:11px !important;
  line-height:1.05 !important;
  font-weight:750 !important;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stu .nm small{
  display:block !important;
  margin-top:2px;
  font-size:8.5px !important;
  line-height:1.05 !important;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--mut);
}

.stu .tm{
  width:100%;
  margin-top:4px;
  padding-top:4px;
  border-top:1px solid rgba(100,116,139,.20);
  font-size:11px !important;
  line-height:1 !important;
  font-weight:800 !important;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}

.stu .tools{
  position:absolute !important;
  inset:0 !important;
  display:none !important;
  align-items:center !important;
  justify-content:center !important;
  gap:3px !important;
  background:rgba(255,255,255,.94);
  z-index:3;
}

.stu.show-tools .tools{
  display:flex !important;
}

.stu.show-tools .student-more{
  display:none !important;
}

.stu .tools button{
  width:25px !important;
  min-width:25px !important;
  height:25px !important;
  padding:0 !important;
  border-radius:7px !important;
  border:1px solid var(--line) !important;
  background:var(--card) !important;
  color:var(--tx) !important;
  font-size:11px !important;
}

@media (max-width:430px){
  #app{
    padding-left:8px !important;
    padding-right:8px !important;
  }
  .list{gap:5px !important}
  .stu{
    border-radius:10px !important;
    padding:7px 3px 6px !important;
  }
  .stu .nm b{font-size:10.5px !important}
  .stu .nm small{font-size:8px !important}
  .stu .tm{font-size:10.5px !important}
}

@media (min-width:700px){
  .list{
    grid-template-columns:repeat(6,minmax(0,1fr)) !important;
  }
}


/* ===== Endurance workflow ===== */
.panel{margin:14px 0;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.compact{min-height:38px!important;padding:0 12px!important;font-size:14px!important;border-radius:10px!important}
.selection-list{display:grid;gap:8px}
.select-student{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.select-student input{width:22px;height:22px;accent-color:var(--pri)}
.select-name{min-width:0}.select-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.selection-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{position:relative;display:block;padding:14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:var(--bg)}
.mode-card.active{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.mode-card input{position:absolute;opacity:0}.mode-card b,.mode-card small{display:block}.mode-card small{margin-top:4px}
.distance-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}
.distance-row span{display:block;margin-bottom:6px;font-size:13px;font-weight:700}
.distance-row input,.distance-row select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);padding:0 12px;font:inherit}
.timer-header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 0 12px}
.timer-header h1{margin:0}.master-time{font-size:clamp(28px,9vw,46px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.race-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.race-card{position:relative;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 6px;min-width:0;border:1.5px solid #9cc9f8;border-radius:11px;background:#eaf4ff;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.race-card.finished{border-color:#75d48a;background:#effbf1}
.race-name{width:100%;min-width:0}.race-name b,.race-name small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-name b{font-size:11px;line-height:1.05}.race-name small{font-size:8px;color:var(--mut);margin-top:1px}
.race-time{width:100%;margin-top:5px;padding-top:4px;border-top:1px solid rgba(100,116,139,.22);font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}
.race-status,.lap-mini{margin-top:3px;font-size:8px;color:var(--mut);line-height:1.05}
.helper-text{margin:12px 2px;color:var(--mut);font-size:13px}
@media(max-width:430px){#app{padding-left:8px;padding-right:8px}.race-grid{gap:5px}.race-card{border-radius:10px;padding:7px 3px 5px}.mode-switch{grid-template-columns:1fr}}
@media(min-width:700px){.race-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}


/* ===== Tours v3 ===== */
.laps-settings{
  margin-top:12px;
}
.laps-settings label span{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}
.laps-settings input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--tx);
  padding:0 12px;
  font:inherit;
}

.race-card.waiting{
  background:#eaf4ff;
  border-color:#9cc9f8;
}

.race-card.active-runner{
  background:#fff7d6;
  border-color:#f4c84e;
}

.race-card.lap-done{
  animation:lapFlash .38s ease;
}

.race-card.finished{
  background:#effbf1 !important;
  border-color:#75d48a !important;
}

@keyframes lapFlash{
  0%{transform:scale(1)}
  45%{transform:scale(.94)}
  100%{transform:scale(1)}
}

.progress-laps{
  margin-top:3px;
  font-size:8px;
  font-weight:700;
  color:var(--tx);
}

.race-card.finished .race-status{
  color:var(--ontx);
  font-weight:700;
}


/* ===== Couleur différente à chaque tour ===== */
.race-card.lap-color-0{background:#fff7d6;border-color:#f4c84e}
.race-card.lap-color-1{background:#e8f4ff;border-color:#69aef7}
.race-card.lap-color-2{background:#f3eaff;border-color:#a67cf0}
.race-card.lap-color-3{background:#ffe9f1;border-color:#ed7fa6}
.race-card.lap-color-4{background:#e9fbf4;border-color:#5ac99a}
.race-card.lap-color-5{background:#fff0e3;border-color:#f3a35c}


/* ===== Ajustements v5 ===== */
.timer-controls{
  margin:14px 0 22px !important;
}


.select-name small{
  display:block;
  margin-top:2px;
  color:var(--mut);
  font-size:11px;
}


dialog select{
  display:block;
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--tx);
  font:18px system-ui,sans-serif;
}

</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";

const KEY="classtimer.endurance.v1",BACKUP_KEY="classtimer.endurance.v1.backup";
let deferredInstallPrompt=null;

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ms=>{ms=Math.max(0,Number(ms)||0);const t=Math.floor(ms/1000),m=Math.floor(t/60),s=t%60,d=Math.floor(ms%1000/100);return `${pad(m)}:${pad(s)}.${d}`};
const fullName=s=>`${s.first||""} ${s.last||""}`.trim();

function normStudent(s){return{id:s.id||uid(),first:s.first||"",last:s.last||"",sex:s.sex||"",selected:s.selected!==false}}
function normClass(c){
  const setup=c.setup||{mode:"race",distance:"",distanceUnit:"m",maxLaps:1};
  if(!setup.maxLaps||setup.maxLaps<1)setup.maxLaps=1;
  return{id:c.id||uid(),name:c.name||"Classe",students:(c.students||[]).map(normStudent),history:Array.isArray(c.history)?c.history:[],setup,activeSession:c.activeSession||null}
}
function normState(s){if(!s||!Array.isArray(s.classes))return null;s.classes=s.classes.map(normClass);return s}
function parse(k){try{const r=localStorage.getItem(k);return r?normState(JSON.parse(r)):null}catch(e){return null}}
function load(){
  let s=parse(KEY)||parse(BACKUP_KEY);
  if(s)return s;
  for(const k of ["classtimer.v2","classtimer.v1"]){
    const l=parse(k); if(l){l.classes=l.classes.map(c=>normClass({...c,students:(c.students||[]).map(x=>({id:x.id,first:x.first,last:x.last,sex:x.sex||"",selected:true})),setup:{mode:"race",distance:"",distanceUnit:"m",maxLaps:1},activeSession:null}));return l}
  }
  return{theme:null,classes:[]};
}
let S=load(),lastSavedAt=null;
function save(){try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BACKUP_KEY,old);const raw=JSON.stringify(S);localStorage.setItem(KEY,raw);localStorage.setItem(BACKUP_KEY,raw);lastSavedAt=Date.now();updateSaveIndicator()}catch(e){alert("Sauvegarde locale impossible.")}}
const cls=id=>S.classes.find(c=>c.id===id);

function route(){
  const h=location.hash||"#/"; let m;
  if((m=h.match(/^#\/setup\/([^/]+)$/)))return{page:"setup",id:m[1]};
  if((m=h.match(/^#\/timer\/([^/]+)$/)))return{page:"timer",id:m[1]};
  return{page:"home"};
}

function dateFR(ts){return new Date(ts).toLocaleString("fr-CH",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function updateSaveIndicator(){const e=$("saveState");if(e)e.innerHTML=`<span class="save-dot"></span> Sauvegardé localement${lastSavedAt?" à "+new Date(lastSavedAt).toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):""}`}
function applyTheme(){document.documentElement.dataset.theme=S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
const topBar=`<div class="top"><span class="brand">⏱ ClassTimer</span><div style="display:flex;gap:8px"><button class="ib" data-act="install">⬇</button><button class="ib" data-act="theme">◐</button></div></div>`;
const saveIndicator=`<div class="save-state" id="saveState"><span class="save-dot"></span>Sauvegardé localement</div>`;

function render(){
  applyTheme(); const r=route(),a=$("app");
  if(r.page==="home")a.innerHTML=homeView();
  if(r.page==="setup")a.innerHTML=setupView(cls(r.id));
  if(r.page==="timer")a.innerHTML=timerView(cls(r.id));
  updateSaveIndicator(); tick();
}

function homeView(){
  const cards=S.classes.map(c=>`<div class="cc" role="button" tabindex="0" data-act="openSetup" data-c="${c.id}"><div class="grow"><b>${esc(c.name)}</b><small>${c.students.length} élèves</small></div><div class="tools"><button class="ib" data-act="renClass" data-c="${c.id}">✎</button><button class="ib" data-act="delClass" data-c="${c.id}">✕</button></div></div>`).join("");
  return`${topBar}${saveIndicator}<h1>Classes</h1><button class="btn pri big" data-act="addClass">+ Ajouter une classe</button><div class="grid">${cards||'<div class="empty">Aucune classe.</div>'}</div>`;
}

function setupView(c){
  if(!c)return homeView();
  const rows=c.students.map(s=>`<label class="select-student"><input type="checkbox" data-act="selectStu" data-c="${c.id}" data-s="${s.id}" ${s.selected!==false?"checked":""}><span class="select-name"><b>${esc(fullName(s))}</b><small>${s.sex==="F"?"Femme":s.sex==="H"?"Homme":""}</small></span><button type="button" class="mini-btn" data-act="editStu" data-c="${c.id}" data-s="${s.id}">✎</button><button type="button" class="mini-btn" data-act="delStu" data-c="${c.id}" data-s="${s.id}">✕</button></label>`).join("");
  const n=c.students.filter(s=>s.selected!==false).length;
  return`${topBar}${saveIndicator}<a class="back" href="#/">‹ Retour aux classes</a><div class="head"><h1>${esc(c.name)}</h1><span class="badge">${n}/${c.students.length} sélectionnés</span></div>
  <section class="panel"><div class="section-title-row"><h2>Élèves</h2><button class="btn compact" data-act="addStu" data-c="${c.id}">+ Ajouter</button></div><div class="selection-list">${rows||'<div class="empty">Aucun élève.</div>'}</div><div class="selection-actions"><button class="btn compact" data-act="selectAll" data-c="${c.id}">Tout sélectionner</button><button class="btn compact" data-act="selectNone" data-c="${c.id}">Tout décocher</button></div></section>
  <section class="panel"><h2>Type de chrono</h2><div class="mode-switch">
  <label class="mode-card ${c.setup.mode==="race"?"active":""}"><input type="radio" name="mode" value="race" data-act="mode" data-c="${c.id}" ${c.setup.mode==="race"?"checked":""}><b>Course</b><small>Départ commun, toucher un élève à son arrivée.</small></label>
  <label class="mode-card ${c.setup.mode==="laps"?"active":""}"><input type="radio" name="mode" value="laps" data-act="mode" data-c="${c.id}" ${c.setup.mode==="laps"?"checked":""}><b>Tours</b><small>Chaque appui enregistre un tour et son temps.</small></label></div>
  <div class="distance-row"><label><span>Distance</span><input id="distanceInput" type="number" min="0" step="1" value="${esc(c.setup.distance||"")}" placeholder="Ex. 400" data-act="distance" data-c="${c.id}"></label><label><span>Unité</span><select data-act="distanceUnit" data-c="${c.id}"><option value="m" ${c.setup.distanceUnit==="m"?"selected":""}>m</option><option value="km" ${c.setup.distanceUnit==="km"?"selected":""}>km</option></select></label></div>
  ${c.setup.mode==="laps"?`<div class="laps-settings"><label><span>Nombre de tours à effectuer</span><input id="maxLapsInput" type="number" min="1" step="1" value="${esc(c.setup.maxLaps||1)}" data-act="maxLaps" data-c="${c.id}"></label></div>`:""}
  </section>
  <button class="btn pri big" data-act="prepareSession" data-c="${c.id}">Continuer vers le chrono</button>`;
}

function makeSession(c){
  const selected=c.students.filter(s=>s.selected!==false);
  if(!selected.length){alert("Sélectionne au moins un élève.");return null}
  const now=Date.now();
  c.activeSession={id:uid(),createdAt:now,startedAt:null,finishedAt:null,status:"ready",mode:c.setup.mode,distance:c.setup.distance,distanceUnit:c.setup.distanceUnit,maxLaps:Math.max(1,parseInt(c.setup.maxLaps||1,10)),participants:selected.map(s=>({studentId:s.id,first:s.first,last:s.last,sex:s.sex||"",startedAt:null,finishedAt:null,elapsedMs:0,laps:[],lastLapAt:null}))};
  save(); return c.activeSession;
}
function sessionElapsed(s,p){const start=p.startedAt||s.startedAt;if(!start)return 0;return Math.max(0,(p.finishedAt||s.finishedAt||Date.now())-start)}
function startAll(c){
  const s=c.activeSession;if(!s||s.status==="finished")return;
  const now=Date.now();
  if(!s.startedAt)s.startedAt=now;
  s.status="running";
  s.participants.forEach(p=>{
    if(!p.startedAt&&!p.finishedAt){
      p.startedAt=now;
      p.lastLapAt=now;
    }
  });
  save();render();
}

function startParticipant(c,p){
  const s=c.activeSession;if(!s||s.status==="finished"||p.finishedAt||p.startedAt)return;
  const now=Date.now();
  p.startedAt=now;
  p.lastLapAt=now;
  if(!s.startedAt)s.startedAt=now;
  s.status="running";
  save();render();
}
function tapParticipant(c,p){
  const s=c.activeSession;if(!s||s.status==="finished")return;
  const now=Date.now();

  // Avant démarrage : toucher une carte démarre uniquement cet élève
  if(!p.startedAt){
    startParticipant(c,p);
    return;
  }

  if(p.finishedAt)return;

  if(s.mode==="race"){
    p.finishedAt=now;
    p.elapsedMs=now-p.startedAt;
    if(s.participants.every(x=>x.finishedAt))finishSession(c);else{save();render()}
    return;
  }

  // Mode tours : un tap = un tour
  const prev=p.lastLapAt||p.startedAt;
  const lap=now-prev;
  const total=now-p.startedAt;

  p.laps.push({
    n:p.laps.length+1,
    lapTimeMs:lap,
    totalTimeMs:total,
    recordedAt:now
  });

  p.lastLapAt=now;

  const maxLaps=Math.max(1,parseInt(s.maxLaps||1,10));

  // Fin automatique de l'élève au dernier tour
  if(p.laps.length>=maxLaps){
    p.finishedAt=now;
    p.elapsedMs=total;
  }

  if(s.participants.every(x=>x.finishedAt)){
    finishSession(c);
  }else{
    save();
    render();
  }
}
function finishSession(c){
  const s=c.activeSession;if(!s||s.status==="finished")return;const now=Date.now();s.finishedAt=now;s.status="finished";
  if(s.mode==="race")s.participants.forEach(p=>{if(!p.finishedAt){p.finishedAt=now;p.elapsedMs=p.startedAt?now-p.startedAt:0}});
  c.history.unshift(JSON.parse(JSON.stringify(s)));save();render();
}

function timerView(c){
  if(!c||!c.activeSession)return`${topBar}${saveIndicator}<a class="back" href="#/setup/${c?.id||""}">‹ Réglages</a><div class="empty">Aucune séance préparée.</div>`;
  const s=c.activeSession;
  const cards=s.participants.map((p,i)=>{
    const last=p.laps[p.laps.length-1];
    const maxLaps=Math.max(1,parseInt(s.maxLaps||1,10));
    const started=!!p.startedAt;
    const finished=!!p.finishedAt;
    const lapColor=(s.mode==="laps"&&started&&!finished)?`lap-color-${p.laps.length%6}`:"";
    const clsState=finished?"finished":started?(s.mode==="laps"?lapColor:"active-runner"):"waiting";
    let status="";
    if(s.mode==="race"){
      status=finished?"Terminé":started?"Toucher à l'arrivée":"Toucher pour démarrer";
    }else{
      status=finished?"Terminé":started?`Tour ${Math.min(p.laps.length+1,maxLaps)} / ${maxLaps}`:"Toucher pour démarrer";
    }
    return`<div class="race-card ${clsState}" role="button" tabindex="0" data-act="tapParticipant" data-c="${c.id}" data-p="${p.studentId}">
      <div class="student-number">#${i+1}</div>
      <div class="race-name"><b>${esc(p.first)}</b><small>${esc(p.last)}${p.sex?` · ${p.sex}`:""}</small></div>
      <div class="race-time" data-time-p="${p.studentId}">${fmt(sessionElapsed(s,p))}</div>
      <div class="race-status">${status}</div>
      ${s.mode==="laps"?`<div class="progress-laps">${p.laps.length}/${maxLaps}</div><div class="lap-mini">${last?`Tour ${last.n}: <b>${fmt(last.lapTimeMs)}</b>`:"Aucun tour"}</div>`:""}
    </div>`
  }).join("");
  return`${topBar}${saveIndicator}<a class="back" href="#/setup/${c.id}">‹ Réglages</a><div class="timer-header"><div><h1>${esc(c.name)}</h1><small>${s.mode==="race"?"Course":`Tours · ${s.maxLaps||1} tour${(s.maxLaps||1)>1?"s":""}`} · ${s.distance?esc(s.distance)+" "+esc(s.distanceUnit):"distance non renseignée"}</small></div><div class="master-time" id="masterTime">00:00.0</div></div>
  <div class="timer-controls">${s.status==="ready"?`<button class="btn pri big" data-act="startAll" data-c="${c.id}">▶ Démarrer tous</button>`:""}${s.status==="running"?`<button class="btn dng big" data-act="finishSession" data-c="${c.id}">■ Terminer la séance</button>`:""}${s.status==="finished"?`<button class="btn pri big" data-act="newSession" data-c="${c.id}">Nouvelle séance</button>`:""}</div>
  <div class="race-grid">${cards}</div><p class="helper-text">${s.mode==="laps"?"Touche une carte pour démarrer cet élève. Ensuite chaque appui enregistre un tour. Au dernier tour, son chrono s’arrête automatiquement.":"À l'arrivée d'un élève, touche sa carte pour enregistrer son temps."}</p><div class="bar"><button class="btn" data-act="csvSession" data-c="${c.id}">Télécharger CSV</button></div>`;
}
function tick(){const r=route();if(r.page!=="timer")return;const c=cls(r.id),s=c&&c.activeSession;if(!s)return;const m=$("masterTime");if(m)m.textContent=fmt(s.startedAt?Math.max(0,(s.finishedAt||Date.now())-s.startedAt):0);document.querySelectorAll("[data-time-p]").forEach(e=>{const p=s.participants.find(x=>x.studentId===e.dataset.timeP);if(p)e.textContent=fmt(sessionElapsed(s,p))})}
setInterval(tick,100);

function show(html){return new Promise(res=>{const d=$("dlg");d.innerHTML=html;d.returnValue="";d.addEventListener("close",()=>{const f=d.querySelector("form");res({v:d.returnValue,f:f?new FormData(f):null})},{once:true});d.showModal()})}
async function ask(title,fields,ok="Enregistrer"){const inputs=fields.map((f,i)=>`<label>${esc(f.label)}<input name="f${i}" value="${esc(f.value||"")}" placeholder="${esc(f.ph||"")}" ${f.opt?"":"required"}></label>`).join("");const r=await show(`<form method="dialog"><h2>${esc(title)}</h2>${inputs}<div class="row"><button value="cancel" class="btn">Annuler</button><button value="ok" class="btn pri">${esc(ok)}</button></div></form>`);return r.v==="ok"?fields.map((_,i)=>(r.f.get("f"+i)||"").trim()):null}
async function confirmBox(msg,ok="Confirmer"){const r=await show(`<form method="dialog"><h2>${esc(msg)}</h2><div class="row"><button value="cancel" class="btn">Annuler</button><button value="ok" class="btn pri">${esc(ok)}</button></div></form>`);return r.v==="ok"}

$("app").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,c=cls(b.dataset.c||route().id);
  if(act==="theme"){S.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();render()}
  else if(act==="install"){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}else alert("iPhone/iPad : Safari → Partager → Sur l’écran d’accueil. Android/Chrome : menu → Installer l’application.")}
  else if(act==="openSetup")location.hash=`#/setup/${b.dataset.c}`
  else if(act==="addClass"){const r=await ask("Ajouter une classe",[{label:"Nom de la classe",ph:"Ex. 10VG1"}],"Créer");if(r){S.classes.push(normClass({id:uid(),name:r[0],students:[]}));save();render()}}
  else if(act==="renClass"){e.stopPropagation();const r=await ask("Renommer la classe",[{label:"Nom",value:c.name}]);if(r){c.name=r[0];save();render()}}
  else if(act==="delClass"){e.stopPropagation();if(await confirmBox(`Supprimer « ${c.name} » ?`,"Supprimer")){S.classes=S.classes.filter(x=>x.id!==c.id);save();render()}}
  else if(act==="addStu"){
    const r=await show(`<form method="dialog">
      <h2>Ajouter un élève</h2>
      <label>Prénom<input name="first" required></label>
      <label>Nom<input name="last"></label>
      <label>Sexe
        <select name="sex" required>
          <option value="">Choisir</option>
          <option value="F">Femme</option>
          <option value="H">Homme</option>
        </select>
      </label>
      <div class="row">
        <button value="cancel" class="btn">Annuler</button>
        <button value="ok" class="btn pri">Ajouter</button>
      </div>
    </form>`);
    if(r.v==="ok"){
      c.students.push({
        id:uid(),
        first:(r.f.get("first")||"").trim(),
        last:(r.f.get("last")||"").trim(),
        sex:r.f.get("sex")||"",
        selected:true
      });
      save();render();
    }
  }
  else if(act==="editStu"){
    e.stopPropagation();
    const s=c.students.find(x=>x.id===b.dataset.s);
    const r=await show(`<form method="dialog">
      <h2>Modifier l'élève</h2>
      <label>Prénom<input name="first" value="${esc(s.first)}" required></label>
      <label>Nom<input name="last" value="${esc(s.last)}"></label>
      <label>Sexe
        <select name="sex" required>
          <option value="">Choisir</option>
          <option value="F" ${s.sex==="F"?"selected":""}>Femme</option>
          <option value="H" ${s.sex==="H"?"selected":""}>Homme</option>
        </select>
      </label>
      <div class="row">
        <button value="cancel" class="btn">Annuler</button>
        <button value="ok" class="btn pri">Enregistrer</button>
      </div>
    </form>`);
    if(r.v==="ok"){
      s.first=(r.f.get("first")||"").trim();
      s.last=(r.f.get("last")||"").trim();
      s.sex=r.f.get("sex")||"";
      save();render();
    }
  }
  else if(act==="delStu"){e.stopPropagation();const s=c.students.find(x=>x.id===b.dataset.s);if(await confirmBox(`Supprimer ${fullName(s)} ?`,"Supprimer")){c.students=c.students.filter(x=>x.id!==s.id);save();render()}}
  else if(act==="selectAll"){c.students.forEach(s=>s.selected=true);save();render()}
  else if(act==="selectNone"){c.students.forEach(s=>s.selected=false);save();render()}
  else if(act==="prepareSession"){c.setup.distance=($("distanceInput")?.value||"").trim();if(c.setup.mode==="laps")c.setup.maxLaps=Math.max(1,parseInt($("maxLapsInput")?.value||c.setup.maxLaps||1,10));if(makeSession(c))location.hash=`#/timer/${c.id}`}
  else if(act==="startAll")startAll(c)
  else if(act==="tapParticipant"){const p=c.activeSession?.participants.find(x=>x.studentId===b.dataset.p);if(p)tapParticipant(c,p)}
  else if(act==="finishSession"){if(await confirmBox("Terminer la séance pour tous ?","Terminer"))finishSession(c)}
  else if(act==="newSession"){c.activeSession=null;save();location.hash=`#/setup/${c.id}`}
  else if(act==="csvSession")exportSessionCsv(c,c.activeSession)
});

$("app").addEventListener("change",e=>{const el=e.target,c=cls(el.dataset.c||route().id);if(!c)return;if(el.dataset.act==="selectStu"){const s=c.students.find(x=>x.id===el.dataset.s);if(s){s.selected=el.checked;save();render()}}else if(el.dataset.act==="mode"){c.setup.mode=el.value;save();render()}else if(el.dataset.act==="distanceUnit"){c.setup.distanceUnit=el.value;save()}else if(el.dataset.act==="maxLaps"){c.setup.maxLaps=Math.max(1,parseInt(el.value||1,10));save()}});
$("app").addEventListener("input",e=>{if(e.target.dataset.act==="distance"){const c=cls(e.target.dataset.c);if(c){c.setup.distance=e.target.value;save()}}else if(e.target.dataset.act==="maxLaps"){const c=cls(e.target.dataset.c);if(c){c.setup.maxLaps=Math.max(1,parseInt(e.target.value||1,10));save()}}});

function csvQ(v){v=String(v??"");return/[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportSessionCsv(c,s){
  let rows=[];

  if(s.mode==="race"){
    rows=[[
      "Classe",
      "Date",
      "Mode",
      "Distance",
      "Unité",
      "Prénom",
      "Nom",
      "Temps total"
    ]];

    s.participants.forEach(p=>{
      rows.push([
        c.name,
        dateFR(p.startedAt||s.startedAt||s.createdAt),
        "Course",
        s.distance,
        s.distanceUnit,
        p.first,
        p.last,
        p.sex==="F"?"Femme":p.sex==="H"?"Homme":"",
        fmt(p.elapsedMs||sessionElapsed(s,p))
      ]);
    });
  }else{
    const maxLaps=Math.max(
      1,
      parseInt(
        s.maxLaps ||
        Math.max(1,...s.participants.map(p=>(p.laps||[]).length)),
        10
      )
    );

    const header=[
      "Classe",
      "Date",
      "Mode",
      "Distance",
      "Unité",
      "Prénom",
      "Nom"
    ];

    for(let i=1;i<=maxLaps;i++){
      header.push(`Tour ${i}`);
    }

    header.push("Temps total");
    rows=[header];

    s.participants.forEach(p=>{
      const line=[
        c.name,
        dateFR(p.startedAt||s.startedAt||s.createdAt),
        "Tours",
        s.distance,
        s.distanceUnit,
        p.first,
        p.last,
        p.sex==="F"?"Femme":p.sex==="H"?"Homme":""
      ];

      for(let i=0;i<maxLaps;i++){
        const lap=(p.laps||[])[i];
        line.push(lap?fmt(lap.lapTimeMs):"");
      }

      const total=p.elapsedMs || (
        p.finishedAt && p.startedAt
          ? Math.max(0,p.finishedAt-p.startedAt)
          : sessionElapsed(s,p)
      );

      line.push(total?fmt(total):"");
      rows.push(line);
    });
  }

  const text="\uFEFF"+rows.map(r=>r.map(csvQ).join(";")).join("\r\n");
  const url=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");
  a.href=url;
  a.download=`${c.name.replace(/\s+/g,"_")}_${s.mode}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
window.addEventListener("hashchange",render);
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save();tick()});
render();
</script>
